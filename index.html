<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danat Mini App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 50px 20px;
    }

    .box {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px #ccc;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background: #2196f3;
      color: white;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🎁 Danat Mini App</h1>
    <p>Assalomu alaykum!</p>
    <button onclick="alert('Salom! 👋')">
      Bosish
    </button>
  </div>
</body>
</html>
