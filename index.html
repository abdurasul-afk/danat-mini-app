<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danat TopUp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 430px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
    }

    .games {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .game {
      background: #1f2937;
      color: white;
      border: 2px solid transparent;
      border-radius: 15px;
      padding: 18px 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .game.active {
      border-color: #8b5cf6;
      background: #312e81;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #e2e8f0;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .price {
      margin-top: 15px;
      padding: 15px;
      background: #111827;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .order {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: none;
      border-radius: 14px;
      background: #8b5cf6;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .order:active {
      transform: scale(0.98);
    }

    .info {
      text-align: center;
      color: #cbd5e1;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💎 DANAT TOPUP</h1>
  <div class="subtitle">O‘yin
