<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire Top Up</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#0b0908;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#110e0c;
  padding-bottom:100px;
}

/* HEADER */

.header{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid #29231f;
}

.back{
  font-size:38px;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.lang{
  background:#29211c;
  padding:11px 17px;
  border-radius:20px;
  font-weight:bold;
}

/* GAME */

.game{
  padding:28px 22px;
  display:flex;
  gap:18px;
  align-items:center;
}

.game-icon{
  width:92px;
  height:92px;
  border-radius:23px;
  background:linear-gradient(
    135deg,
    #2429d9,
    #087edb,
    #fa3d19
  );
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:17px;
  font-weight:900;
  box-shadow:0 8px 25px #000;
}

.game-name{
  font-size:31px;
  font-weight:900;
}

.game-sub{
  color:#a69f99;
  margin-top:7px;
  font-size:16px;
}

.time{
  display:inline-block;
  margin-top:9px;
  background:#442116;
  color:#ff6028;
  padding:7px 12px;
  border-radius:18px;
  font-size:14px;
  font-weight:bold;
}

/* CONTENT */

.content{
  padding:0 22px;
}

.title{
  font-size:20px;
  font-weight:900;
  margin:8px 0 15px;
}

.regions{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:8px;
}

.regions::-webkit-scrollbar{
  display:none;
}

.region{
  border:0;
  color:#aaa;
  background:#28211d;
  padding:13px 20px;
  border-radius:25px;
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
}

.region.active{
  background:#ff571f;
  color:#fff;
}

/* ACCOUNT */

.account{
  margin-top:20px;
  background:#211914;
  border-radius:23px;
  padding:22px;
}

.account-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:19px;
}

.label{
  color:#aaa;
  font-size:15px;
  font-weight:bold;
  margin-bottom:9px;
}

  height:62px;
